# 第一關(cloud-ready spec §1)驗收用:本機 docker compose 就能把專案叫起來、參數全在 .env。
# shape: web 用 `docker compose up`;shape: job 改用下方註解的 job service。
# 引擎中立(spec §1.9):image 寫完整 registry 路徑;引擎專屬設定放 compose.override.yml(已 gitignore)。
name: team-project-name

services:
  app:
    build: .
    env_file:
      - .env                    # 值的唯一來源,不進版控;cp .env.example .env 再填
    environment:
      PORT: "8080"
      # 本機用的 base URL;上雲換成 https://<app>.sit.<公司網域>
      APP_BASE_URL: http://localhost:8080
      # 對外發送開關一律放這裡、預設關閉(spec §1.6),不放 .env——
      # 「這個服務會不會對外發東西」要在這個檔看得見
      NOTIFY_DRY_RUN: "1"
    ports:
      - "8080:8080"
    restart: "no"

  # 有 DB 就本機起 Postgres,別用 SQLite——上雲一定是 Postgres,
  # 本機用不同的 DB 等於把「SQL 方言差異」留到上雲那天才爆(spec §1.3/§4.5)。
  # db:
  #   image: docker.io/library/postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: app
  #     POSTGRES_PASSWORD: devonly
  #     POSTGRES_DB: app
  #   ports:
  #     - "5432:5432"

  # shape: job(批次作業)用這個取代上面的 app service(spec §1.4):
  # 用法:docker compose run --rm job <工作名>(不帶參數 → 印出可跑的工作清單)
  # job:
  #   build: .
  #   env_file:
  #     - .env
  #   environment:
  #     OUT_DIR: /out           # 產出導到掛出來的目錄;🔴 不要把 host 目錄掛到 /tmp
  #     NOTIFY_DRY_RUN: "1"
  #   volumes:
  #     - ./out:/out            # 🔒 產出含個資 → ./out 已 gitignore
  #   restart: "no"             # 🔴 會通知真人的工作,失敗不自動重跑(叢集對應 backoffLimit: 0)
  #   mem_limit: 2g             # 對齊叢集 limits,免得本機過了雲端 OOM
