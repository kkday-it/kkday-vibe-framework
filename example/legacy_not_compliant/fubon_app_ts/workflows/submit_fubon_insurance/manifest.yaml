version: "1.0"
workflow:
  name: "submit_fubon_insurance"
  description: "每日全自動抓取名單並執行富邦投保"

permissions:
  needs_browser: true
  credentials:
    - FUBON_COMPANY
    - FUBON_USER
    - FUBON_PASSWORD
    - FUBON_BIRTHDAY
    - GOOGLE_SERVICE_ACCOUNT_EMAIL
    - GOOGLE_PRIVATE_KEY_B64
    - FUBON_NAMELIST_DRIVE_FOLDER_ID
    - FUBON_CERT_DRIVE_FOLDER_ID
    - FUBON_LOG_SHEET_ID
    - SLACK_WEBHOOK_URL
  network:
    allow_hosts:
      - b2b.518fb.com
      - googleapis.com
      - hooks.slack.com
