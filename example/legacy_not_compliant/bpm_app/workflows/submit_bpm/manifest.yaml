id: submit_bpm
owner: your.name
type: automation
intent: "將匯退紀錄 CSV 資料自動登入 Odoo 並啟動 BPM 簽核流程"
risk_tier: red

inputs:
  order_no:
    type: string
    description: "訂單編號"
  company:
    type: string
    description: "公司名稱"
  currency:
    type: string
    description: "幣別"
  cert_company:
    type: string
    description: "憑證開立公司"
  amount:
    type: string
    description: "匯退金額"
  dept:
    type: string
    description: "負責部門"

outputs:
  status:
    type: string
    description: "success or error"

credentials:
  - vault://bpm_app/ODOO_SESSION_PATH
