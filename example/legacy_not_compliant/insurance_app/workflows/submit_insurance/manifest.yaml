id: submit_insurance
owner: your.name
type: automation
intent: "將名單資料自動登入旅行業責任險系統並投保，最後下載保單"
risk_tier: yellow

inputs:
  eff_date:
    type: string
    description: "起保日期 (民國年格式: YYY/MM/DD)"
  exp_date:
    type: string
    description: "迄保日期 (民國年格式: YYY/MM/DD)"
  excel_file_path:
    type: string
    description: "暫存的 Excel 名單檔案路徑"
  tra_no:
    type: string
    description: "圈號"
  represent_mem:
    type: string
    description: "代表人姓名"
  total_mem:
    type: integer
    description: "總人數"

outputs:
  status:
    type: string
    description: "success or error"
  transaction_no:
    type: string
  review_no:
    type: string
  insurance_fee:
    type: string
  txt_path:
    type: string
  pdf_path:
    type: string

credentials:
  - vault://insurance_app/ACCOUNT
  - vault://insurance_app/PASSWORD
  - vault://insurance_app/COMPANY
  - vault://insurance_app/BIRTHDAY
  - vault://insurance_app/CAPTCHA
  - vault://insurance_app/CASE_OWNER
